[workspace]
resolver = "3"
members = [
    "crates/tile-ir",
    "crates/tile-msl",
    "crates/tile-metal",
    "crates/tile-bench",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/alpibrusl/lex-gpu"

[workspace.dependencies]
tile-ir = { path = "crates/tile-ir" }
tile-msl = { path = "crates/tile-msl" }
tile-metal = { path = "crates/tile-metal" }
half = "2"

[profile.release]
debug = true
