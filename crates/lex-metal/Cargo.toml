[package]
name = "lex-metal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Metal device glue: compile emitted MSL, allocate buffers, dispatch, time."

[dependencies]
lex-ir = { workspace = true }
lex-msl = { workspace = true }

[dev-dependencies]
lex-front = { workspace = true }
half = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.31"

# The `objc` macros metal-rs re-exports check `feature = "cargo-clippy"`
# internally; declare it so `-D warnings` does not trip on their expansion.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
